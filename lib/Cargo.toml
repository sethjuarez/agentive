[package]
name = "agentive"
version = "0.5.1"
edition = "2021"
description = "A Rust crate for building agentic LLM applications with streaming, tool calling, and multi-turn conversation loops"
license = "MIT"
repository = "https://github.com/sethjuarez/agentive"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.12", features = ["stream", "json"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

# Azure OAuth (PKCE + token exchange)
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"

tracing = { version = "0.1", optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
